<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, table, td, p, a {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0d0d0d;">

  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 48px 16px;">
    <tr>
      <td align="center">
        <table width="460" cellpadding="0" cellspacing="0" style="background-color: #141414; border: 1px solid #222222; border-radius: 8px;">
          <tr>
            <td style="padding: 40px 40px 32px; text-align: center; border-bottom: 1px solid #1a1a1a;">
              <table cellpadding="0" cellspacing="0" style="margin: 0 auto;">
                <tr>
                  <td style="width: 8px; height: 8px; border-radius: 50%; background-color: #c8f542;"></td>
                  <td width="12"></td>
                  <td style="font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 14px; font-weight: 500; color: #e8e6e1; letter-spacing: 0.08em; text-transform: uppercase;">
                    {{ site_name }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding: 36px 40px;">
              
              <p style="font-size: 20px; font-weight: 300; color: #e8e6e1; line-height: 1.3; margin: 0 0 12px;">
                Reset your password
              </p>
              
              <p style="font-size: 15px; color: #999999; line-height: 1.7; margin: 0 0 24px;">
                Someone requested a password reset for your {{ site_name }} account. Click the button below to choose a new password.
              </p>

              <table cellpadding="0" cellspacing="0" style="margin: 0 0 24px;">
                <tr>
                  <td align="center" style="background-color: #c8f542; border-radius: 4px;">
                    <a href="{{ reset_url }}" target="_blank" style="display: inline-block; padding: 14px 32px; font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 12px; font-weight: 500; color: #0d0d0d; text-decoration: none; text-transform: uppercase; letter-spacing: 0.06em;">
                      Reset password →
                    </a>
                  </td>
                </tr>
              </table>

              <p style="font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 11px; color: #666666; line-height: 1.5; margin: 0 0 6px; letter-spacing: 0.04em;">
                This link expires in <strong style="color: #888888;">1 hour</strong>
              </p>
              <p style="font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 11px; color: #555555; line-height: 1.5; margin: 0; letter-spacing: 0.04em;">
                If you didn't request this, you can safely ignore this email.
              </p>

            </td>
          </tr>

          <tr>
            <td style="padding: 24px 40px; border-top: 1px solid #1a1a1a;">
              <table cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 11px; color: #555555; letter-spacing: 0.06em; text-transform: uppercase;">
                    {{ site_name }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
