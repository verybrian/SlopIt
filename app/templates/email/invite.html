<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, table, td, p, a {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0d0d0d;">

  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 48px 16px;">
    <tr>
      <td align="center">
        <table width="460" cellpadding="0" cellspacing="0" style="background-color: #141414; border: 1px solid #222222; border-radius: 8px;">

          <tr>
            <td style="padding: 40px 40px 32px; text-align: center; border-bottom: 1px solid #1a1a1a;">
              <table cellpadding="0" cellspacing="0" style="margin: 0 auto;">
                <tr>
                  <td>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
                      <path d="M8 22L16 10l8 12" stroke="#c8f542" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                      <path d="M12 26l4-6 4 6" stroke="#c8f542" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
                    </svg>
                  </td>
                  <td width="12"></td>
                  <td style="font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 14px; font-weight: 500; color: #e8e6e1; letter-spacing: 0.08em; text-transform: uppercase;">
                    SlopIt
                  </td>
                </tr>
              </table>
              <p style="font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 11px; color: #666666; letter-spacing: 0.1em; text-transform: uppercase; margin: 16px 0 0;">
                Content Management System
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding: 36px 40px;">
                <p style="font-size: 20px; font-weight: 300; color: #e8e6e1; line-height: 1.3; margin: 0 0 12px;">
                    You've been invited to {{ site_name }}
                </p>
                
                <p style="font-size: 15px; color: #999999; line-height: 1.7; margin: 0 0 8px;">
                    Join <strong style="color: #cccccc;">{{ site_name }}</strong> as an editor. Set up your account to start creating and managing content.
                </p>

              <table cellpadding="0" cellspacing="0" style="margin: 0 0 32px;">
                <tr>
                  <td align="center" style="background-color: #c8f542; border-radius: 4px;">
                    <a href="{{ invite_url }}" target="_blank" style="display: inline-block; padding: 14px 32px; font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 12px; font-weight: 500; color: #0d0d0d; text-decoration: none; text-transform: uppercase; letter-spacing: 0.06em;">
                      Set up your account →
                    </a>
                  </td>
                </tr>
              </table>

              <table cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="border-top: 1px solid #1a1a1a; padding-top: 24px;">
                    <p style="font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 11px; color: #666666; line-height: 1.5; margin: 0 0 6px; letter-spacing: 0.04em;">
                      This link expires in <strong style="color: #888888;">7 days</strong>
                    </p>
                    <p style="font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 11px; color: #555555; line-height: 1.5; margin: 0; letter-spacing: 0.04em;">
                      If you didn't expect this, ignore this email.
                    </p>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

        <p style="font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 11px; color: #444444; letter-spacing: 0.04em; text-align: center; margin-top: 24px;">
            {{ site_description }}
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
