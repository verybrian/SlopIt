<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — {{ site_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/404.css') }}">
</head>
<body>

<div class="error-wrap">
  <div class="error-brand">
    <span class="error-dot"></span>
  </div>
  
  <div class="error-code">404</div>
  <h1 class="error-title">Page not found</h1>
  <p class="error-desc">
    The page you're looking for doesn't exist or has been moved.
  </p>
  
  <div class="error-actions">
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-primary">Go to dashboard</a>
    {% else %}
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go home</a>
      <a href="{{ url_for('auth.login') }}" class="btn btn-ghost">Log in</a>
    {% endif %}
  </div>
</div>

</body>
</html>
